[project]
name = "pacman"
version = "0.1.0"
description = "Recreate the famous arcade game Pac-man!"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.6.1",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "flake8-docstrings>=1.7.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
